<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - WorkConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <h1>Create Your Account</h1>

            <p>Join WorkConnect and explore opportunities.</p>


            <!-- Account Type -->

            <h3>Select Account Type</h3>

            <div class="role-selection">

                <button type="button" class="role-btn active" id="workerBtn">
                    👷 Worker
                </button>

                <button type="button" class="role-btn" id="employerBtn">
                    🏢 Employer
                </button>

            </div>


            <!-- Registration Form -->

            <form id="registerForm">

                <input type="hidden" id="role" value="worker">


                <!-- Common Fields -->

                <div class="form-group">

                    <label>Full Name</label>

                    <input type="text" id="fullName"
                        placeholder="Enter your full name" required>

                </div>


                <div class="form-group">

                    <label>Mobile Number</label>

                    <input type="tel" id="phone"
                        placeholder="Enter 10 digit mobile number"
                        pattern="[0-9]{10}" required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input type="password" id="password"
                        placeholder="Create password"
                        minlength="6" required>

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input type="password" id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6" required>

                </div>


                <!-- Worker Fields -->

                <div id="workerFields">

                    <div class="form-group">

                        <label>Location</label>

                        <input type="text" id="workerLocation"
                            placeholder="Enter your location">

                    </div>


                    <div class="form-group">

                        <label>Select Your Skill</label>

                        <select id="workerSkill">

                            <option value="">Select Skill</option>

                            <option value="Hotel Worker">Hotel Worker</option>

                            <option value="House Cleaning">House Cleaning</option>

                            <option value="Construction">Construction</option>

                            <option value="Electrician">Electrician</option>

                            <option value="Plumber">Plumber</option>

                            <option value="Driver">Driver</option>

                            <option value="Delivery">Delivery Worker</option>

                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Availability</label>

                        <select id="availability">

                            <option value="">Select Availability</option>

                            <option value="Full Time">Full Time</option>

                            <option value="Part Time">Part Time</option>

                            <option value="Daily Wage">Daily Wage</option>

                        </select>

                    </div>

                </div>


                <!-- Employer Fields -->

                <div id="employerFields" class="hidden">

                    <div class="form-group">

                        <label>Business Name</label>

                        <input type="text" id="businessName"
                            placeholder="Enter business name">

                    </div>


                    <div class="form-group">

                        <label>Business Type</label>

                        <select id="businessType">

                            <option value="">Select Business Type</option>

                            <option value="Hotel">Hotel / Restaurant</option>

                            <option value="Construction">Construction</option>

                            <option value="Shopping">Shopping Mall</option>

                            <option value="Household">Household</option>

                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Business Location</label>

                        <input type="text" id="businessLocation"
                            placeholder="Enter business location">

                    </div>

                </div>

                <!-- Registration Message -->

                <div id="registerMessage"></div>


                <button type="submit" class="create-account-btn">
                    Create Account
                </button>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
