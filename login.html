<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - WorkConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <h1>Welcome Back!</h1>

            <p>Login to your WorkConnect account.</p>


            <!-- Account Type -->

            <h3>Login As</h3>

            <div class="role-selection">

                <button type="button" class="role-btn active" id="workerLoginBtn">
                    👷 Worker
                </button>

                <button type="button" class="role-btn" id="employerLoginBtn">
                    🏢 Employer
                </button>

            </div>


            <!-- Login Form -->

            <form id="loginForm">

                <div class="form-group">

                    <label>Mobile Number</label>

                    <input type="tel" id="loginPhone"
                        placeholder="Enter mobile number"
                        pattern="[0-9]{10}" required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input type="password" id="loginPassword"
                        placeholder="Enter your password"
                        required>

                </div>

                <!-- Login Message -->

                <div id="loginMessage"></div>


                <button type="submit" class="create-account-btn">
                    Login
                </button>

            </form>


            <p class="login-text">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
